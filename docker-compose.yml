services:
  searxng:
    image: searxng/searxng:latest
    container_name: local-research-agent-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: local-research-agent-qdrant
    ports:
      - "6333:6333"  # REST — used by store/qdrant_store.py
      - "6334:6334"  # gRPC — unused for now, exposed for future prefer_grpc=True
    volumes:
      - ./.qdrant_storage:/qdrant/storage
    restart: unless-stopped
