<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>local-research-agent</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --warn-bg: #fff7ed;
    --warn-border: #fdba74;
    --error-bg: #fef2f2;
    --error-border: #fca5a5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #1f2025;
      --text: #e8e8ea;
      --muted: #9a9ba3;
      --border: #33343a;
      --accent: #3b82f6;
      --accent-text: #0b0d12;
      --warn-bg: #2a2015;
      --warn-border: #7c4a12;
      --error-bg: #2a1616;
      --error-border: #7c2626;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  textarea {
    flex: 1;
    resize: vertical;
    min-height: 44px;
    max-height: 200px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 0 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  #progress-list {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 13px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #progress-list li {
    padding: 2px 0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #progress-list li:last-child {
    color: var(--text);
    font-weight: 600;
  }
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .answer {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
  }
  .sources { margin: 8px 0 0; padding-left: 20px; font-size: 14px; }
  .sources li { margin-bottom: 4px; }
  .sources a { color: var(--accent); text-decoration: none; }
  .sources a:hover { text-decoration: underline; }
  .citation-badge { color: var(--muted); font-size: 12px; }
  #candidates-panel summary {
    cursor: pointer;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  #candidates-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 13px;
  }
  #candidates-table th {
    text-align: left;
    color: var(--muted);
    font-weight: 400;
    padding: 4px 8px 4px 0;
    border-bottom: 1px solid var(--border);
  }
  #candidates-table td {
    padding: 5px 8px 5px 0;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  #candidates-table a { color: var(--accent); text-decoration: none; }
  #candidates-table a:hover { text-decoration: underline; }
  .read-mark { color: #22c55e; }
  .stats { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .expand-btn {
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
    cursor: pointer;
  }
  .expand-btn:hover { color: var(--text); border-color: var(--accent); }
  .expand-btn:disabled { opacity: 0.5; cursor: default; }
  #turns .panel:not(:last-child) { opacity: 0.85; }
  .turn-question {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  #followup-form { display: flex; gap: 8px; margin-bottom: 24px; }
  #followup-form.hidden { display: none; }
  .gaps {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-top: 12px;
  }
  .gaps strong { display: block; margin-bottom: 4px; }
  .error {
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
  }
  .hidden { display: none; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    padding: 8px 4px;
    margin-right: 16px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 0;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

  #digest-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
    font-size: 14px;
  }
  #digest-form label { color: var(--muted); display: flex; align-items: center; gap: 4px; }
  #digest-form input[type="number"] {
    width: 64px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  .digest-query-input {
    flex: 1 1 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  .digest-query-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .digest-query-hint { flex: 1 1 100%; font-size: 12px; color: var(--muted); margin-top: -4px; }
  #digest-limit-label.disabled { opacity: 0.5; }
  .category-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 8px 0;
    width: 100%;
  }
  .category-list label {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .category-list input { margin-right: 4px; }
  #digest-summary {
    white-space: pre-wrap;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .digest-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .digest-item:last-child { border-bottom: none; }
  .digest-item-title { font-weight: 600; font-size: 14px; }
  .digest-item-title a { color: var(--text); text-decoration: none; }
  .digest-item-title a:hover { color: var(--accent); text-decoration: underline; }
  .digest-item-meta { color: var(--muted); font-size: 12px; margin: 2px 0 4px; }
  .digest-item-abstract { font-size: 13px; color: var(--text); opacity: 0.85; }
  .digest-item-analysis {
    margin-top: 8px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 13px;
  }
  .digest-analysis-summary { margin-bottom: 6px; }
  .digest-analysis-meta { color: var(--muted); margin-bottom: 6px; }
  .digest-analysis-authors { margin: 0; padding-left: 18px; }
  .digest-analysis-authors li { margin-bottom: 2px; }
  .digest-analysis-unindexed { color: var(--muted); font-style: italic; }
  .digest-insights {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .digest-insights-heading {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .digest-insights-findings { margin-bottom: 6px; }
  .digest-md-p { margin: 0 0 6px; }
  .digest-md-p:last-child { margin-bottom: 0; }
  .digest-md-list { margin: 0 0 6px; padding-left: 18px; }
  .digest-md-list li { margin-bottom: 2px; }
  .digest-stars { color: var(--muted); white-space: nowrap; }
  .digest-insights-links { font-size: 12px; word-break: break-all; }
  .digest-insights-links a { color: var(--accent); text-decoration: none; }
  .digest-insights-links a:hover { text-decoration: underline; }
  .digest-item-analysis-area { margin-top: 8px; }
  .digest-item-analysis-progress {
    list-style: none;
    margin: 6px 0 0;
    padding: 0;
    font-size: 12px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .digest-item-analysis-progress li { padding: 2px 0; white-space: pre-wrap; word-break: break-word; }
  .digest-item-analysis-progress li:last-child { color: var(--text); font-weight: 600; }
  .digest-item-analysis-area .error { margin-top: 6px; padding: 8px 10px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>local-research-agent</h1>
  <p class="subtitle">Deep-research: arXiv, Semantic Scholar, веб-поиск — локально, на MLX.</p>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="tab-research">Исследование</button>
    <button type="button" class="tab-btn" id="tab-digest">Дайджест: свежие статьи</button>
  </div>

  <div id="research-section">
    <form id="form">
      <textarea id="question" placeholder="Задайте вопрос для исследования…" required></textarea>
      <button id="submit" type="submit">Спросить</button>
    </form>

    <div id="progress-panel" class="panel hidden">
      <h2>Ход исследования</h2>
      <ul id="progress-list"></ul>
    </div>

    <div id="error-panel" class="hidden">
      <div class="error" id="error-text"></div>
    </div>

    <div id="turns"></div>

    <form id="followup-form" class="hidden">
      <textarea id="followup-question" placeholder="Уточняющий вопрос по этому же диалогу…"></textarea>
      <button id="followup-submit" type="submit">Уточнить</button>
    </form>

    <details id="candidates-panel" class="panel hidden">
      <summary id="candidates-summary">Все найденные кандидаты</summary>
      <table id="candidates-table">
        <thead>
          <tr><th></th><th>score</th><th>цитирований</th><th>источник</th><th>заголовок</th><th></th></tr>
        </thead>
        <tbody id="candidates-body"></tbody>
      </table>
    </details>
  </div>

  <div id="digest-section" class="hidden">
    <form id="digest-form">
      <input type="text" id="digest-query" class="digest-query-input"
             placeholder="Тема (необязательно) — например, diffusion models">
      <div id="digest-query-hint" class="digest-query-hint hidden">
        При заданной теме показываются 5 самых релевантных статей за период — поле «Показать» не используется.
      </div>
      <label>За последние <input type="number" id="digest-days" value="7" min="1" max="90"> дн.</label>
      <label id="digest-limit-label">Показать <input type="number" id="digest-limit" value="20" min="1" max="100"> статей</label>
      <label><input type="checkbox" id="digest-no-summary"> без обзора тем</label>
      <button id="digest-submit" type="submit">Собрать дайджест</button>
      <div class="category-list" id="digest-categories"></div>
    </form>

    <div id="digest-progress-panel" class="panel hidden">
      <h2>Ход сбора</h2>
      <ul id="digest-progress-list"></ul>
    </div>

    <div id="digest-error-panel" class="hidden">
      <div class="error" id="digest-error-text"></div>
    </div>

    <div id="digest-result" class="panel hidden">
      <h2 id="digest-heading"></h2>
      <div id="digest-summary" class="hidden"></div>
      <div id="digest-items"></div>
    </div>
  </div>
</div>

<script>
const form = document.getElementById("form");
const questionEl = document.getElementById("question");
const submitBtn = document.getElementById("submit");
const followupForm = document.getElementById("followup-form");
const followupQuestionEl = document.getElementById("followup-question");
const followupSubmitBtn = document.getElementById("followup-submit");
const progressPanel = document.getElementById("progress-panel");
const progressList = document.getElementById("progress-list");
const errorPanel = document.getElementById("error-panel");
const errorText = document.getElementById("error-text");
const turnsEl = document.getElementById("turns");
const candidatesPanel = document.getElementById("candidates-panel");
const candidatesSummary = document.getElementById("candidates-summary");
const candidatesBody = document.getElementById("candidates-body");

let pollTimer = null;
let sessionId = null;
let busy = false;

function setBusy(value) {
  busy = value;
  submitBtn.disabled = value;
  followupSubmitBtn.disabled = value;
}

function beginTurn() {
  if (pollTimer) clearTimeout(pollTimer);
  progressPanel.classList.remove("hidden");
  errorPanel.classList.add("hidden");
  progressList.innerHTML = "";
  setBusy(true);
}

function renderProgress(messages, running) {
  progressList.innerHTML = "";
  messages.forEach((msg, i) => {
    const li = document.createElement("li");
    const isLast = i === messages.length - 1;
    li.textContent = msg;
    if (isLast && running) {
      const spinner = document.createElement("span");
      spinner.className = "spinner";
      li.prepend(spinner);
    }
    progressList.appendChild(li);
  });
  progressList.scrollTop = progressList.scrollHeight;
}

// Каждый ход диалога (исходный вопрос + каждый follow-up) - своя панель,
// добавляется в #turns, а не затирает предыдущую - иначе видно только
// последний ответ и теряется нить уточнений.
function renderTurn(question, result) {
  const panel = document.createElement("div");
  panel.className = "panel";

  const q = document.createElement("div");
  q.className = "turn-question";
  q.textContent = question;
  panel.appendChild(q);

  const answer = document.createElement("div");
  answer.className = "answer";
  answer.textContent = result.answer;
  panel.appendChild(answer);

  if (result.gaps && result.gaps.length > 0) {
    const div = document.createElement("div");
    div.className = "gaps";
    const strong = document.createElement("strong");
    strong.textContent = "Непокрытые вопросы (бюджет исследования исчерпан):";
    div.appendChild(strong);
    result.gaps.forEach((gap) => {
      const p = document.createElement("div");
      p.textContent = "— " + gap;
      div.appendChild(p);
    });
    panel.appendChild(div);
  }

  const sourcesHeading = document.createElement("h2");
  sourcesHeading.style.marginTop = "16px";
  sourcesHeading.textContent = "Источники";
  panel.appendChild(sourcesHeading);

  const sourcesEl = document.createElement("ol");
  sourcesEl.className = "sources";
  result.sources.forEach((source) => {
    const li = document.createElement("li");
    if (source.url) {
      const a = document.createElement("a");
      a.href = source.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = source.title;
      li.appendChild(a);
    } else {
      li.textContent = source.title;
    }
    if (source.citation_count !== null && source.citation_count !== undefined) {
      const badge = document.createElement("span");
      badge.className = "citation-badge";
      badge.textContent = ` · цитирований: ${source.citation_count}`;
      li.appendChild(badge);
    }
    sourcesEl.appendChild(li);
  });
  panel.appendChild(sourcesEl);

  const stats = document.createElement("div");
  stats.className = "stats";
  stats.textContent =
    `Итераций: ${result.iterations} · прочитано источников: ${result.read_count} · ` +
    `найдено кандидатов: ${result.candidates_count}`;
  panel.appendChild(stats);

  turnsEl.appendChild(panel);
  panel.scrollIntoView({ behavior: "smooth", block: "start" });

  renderCandidates(result.candidates || []);
  followupForm.classList.remove("hidden");
}

// Кандидаты кумулятивны на весь диалог (ResearchState копится между
// follow-up-ходами) - таблица всегда отражает состояние целиком, а не
// только последний ход.
function renderCandidates(candidates) {
  candidatesBody.innerHTML = "";
  if (candidates.length === 0) {
    candidatesPanel.classList.add("hidden");
    return;
  }
  candidatesSummary.textContent = `Все найденные кандидаты (${candidates.length}) — как агент сузил поиск`;
  candidates.forEach((c) => {
    const tr = document.createElement("tr");

    const markTd = document.createElement("td");
    markTd.textContent = c.read ? "✓" : "";
    markTd.className = "read-mark";
    tr.appendChild(markTd);

    const scoreTd = document.createElement("td");
    scoreTd.textContent = c.triage_score !== null && c.triage_score !== undefined
      ? c.triage_score.toFixed(3) : "—";
    tr.appendChild(scoreTd);

    const citationTd = document.createElement("td");
    citationTd.textContent = c.citation_count !== null && c.citation_count !== undefined
      ? c.citation_count : "—";
    tr.appendChild(citationTd);

    const sourceTd = document.createElement("td");
    sourceTd.textContent = c.source;
    tr.appendChild(sourceTd);

    const titleTd = document.createElement("td");
    if (c.url) {
      const a = document.createElement("a");
      a.href = c.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = c.title;
      titleTd.appendChild(a);
    } else {
      titleTd.textContent = c.title;
    }
    tr.appendChild(titleTd);

    const expandTd = document.createElement("td");
    if (c.id) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "expand-btn";
      btn.textContent = "подробнее";
      btn.addEventListener("click", () => expandCandidate(c));
      expandTd.appendChild(btn);
    }
    tr.appendChild(expandTd);

    candidatesBody.appendChild(tr);
  });
  candidatesPanel.classList.remove("hidden");
}

function renderError(message) {
  progressPanel.classList.add("hidden");
  errorPanel.classList.remove("hidden");
  errorText.textContent = "Ошибка: " + message;
}

async function poll(jobId, question) {
  let resp;
  try {
    resp = await fetch(`/api/jobs/${jobId}`);
  } catch (e) {
    pollTimer = setTimeout(() => poll(jobId, question), 1500);
    return;
  }
  if (!resp.ok) {
    renderError("не удалось получить статус запроса (" + resp.status + ")");
    setBusy(false);
    return;
  }
  const data = await resp.json();
  renderProgress(data.progress, data.status === "running");

  if (data.status === "running") {
    pollTimer = setTimeout(() => poll(jobId, question), 1000);
  } else if (data.status === "done") {
    sessionId = data.session_id;
    renderTurn(question, data.result);
    setBusy(false);
  } else {
    renderError(data.error || "неизвестная ошибка");
    setBusy(false);
  }
}

async function submitJob(url, body, question) {
  beginTurn();
  let resp;
  try {
    resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch (err) {
    renderError("не удалось связаться с сервером");
    setBusy(false);
    return;
  }

  if (resp.status === 409 || resp.status === 404) {
    const data = await resp.json();
    renderError(data.detail || "запрос отклонён сервером");
    setBusy(false);
    return;
  }
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    renderError(data.detail || ("ошибка запроса (" + resp.status + ")"));
    setBusy(false);
    return;
  }

  const data = await resp.json();
  poll(data.job_id, question);
}

function expandCandidate(candidate) {
  if (busy) return;
  const question = `Расскажи подробнее об источнике: ${candidate.title}`;
  submitJob(`/api/sessions/${sessionId}/followup`, { question, focus_candidate_id: candidate.id }, question);
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  if (busy) return;
  const question = questionEl.value.trim();
  if (!question) return;

  // Новый исходный вопрос - новый диалог: сбрасываем накопленные ходы и
  // таблицу кандидатов прежней сессии.
  sessionId = null;
  turnsEl.innerHTML = "";
  candidatesPanel.classList.add("hidden");
  followupForm.classList.add("hidden");

  submitJob("/api/jobs", { question }, question);
});

followupForm.addEventListener("submit", (e) => {
  e.preventDefault();
  if (busy || !sessionId) return;
  const question = followupQuestionEl.value.trim();
  if (!question) return;
  followupQuestionEl.value = "";
  submitJob(`/api/sessions/${sessionId}/followup`, { question }, question);
});

// --- Вкладки: Исследование / Дайджест ---
const tabResearch = document.getElementById("tab-research");
const tabDigest = document.getElementById("tab-digest");
const researchSection = document.getElementById("research-section");
const digestSection = document.getElementById("digest-section");

function selectTab(tab) {
  const isDigest = tab === "digest";
  tabDigest.classList.toggle("active", isDigest);
  tabResearch.classList.toggle("active", !isDigest);
  digestSection.classList.toggle("hidden", !isDigest);
  researchSection.classList.toggle("hidden", isDigest);
}
tabResearch.addEventListener("click", () => selectTab("research"));
tabDigest.addEventListener("click", () => selectTab("digest"));

// --- Дайджест: свежие статьи по ИИ ---
// Тот же набор, что и config.ARXIV_AI_CATEGORIES — статика не может прочитать
// конфиг сервера напрямую, дублируем список здесь (единственное место в UI,
// где это нужно).
const ARXIV_AI_CATEGORIES = ["cs.AI", "cs.LG", "cs.CL", "cs.CV", "cs.NE", "stat.ML"];
const digestCategoriesEl = document.getElementById("digest-categories");
ARXIV_AI_CATEGORIES.forEach((cat) => {
  const label = document.createElement("label");
  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.value = cat;
  checkbox.checked = true;
  label.appendChild(checkbox);
  label.appendChild(document.createTextNode(cat));
  digestCategoriesEl.appendChild(label);
});

const digestForm = document.getElementById("digest-form");
const digestSubmitBtn = document.getElementById("digest-submit");
const digestQueryEl = document.getElementById("digest-query");
const digestDaysEl = document.getElementById("digest-days");
const digestLimitEl = document.getElementById("digest-limit");
const digestNoSummaryEl = document.getElementById("digest-no-summary");
const digestQueryHint = document.getElementById("digest-query-hint");
const digestLimitLabel = document.getElementById("digest-limit-label");
const digestProgressPanel = document.getElementById("digest-progress-panel");
const digestProgressList = document.getElementById("digest-progress-list");
const digestErrorPanel = document.getElementById("digest-error-panel");
const digestErrorText = document.getElementById("digest-error-text");
const digestResultPanel = document.getElementById("digest-result");
const digestHeading = document.getElementById("digest-heading");
const digestSummaryEl = document.getElementById("digest-summary");
const digestItemsEl = document.getElementById("digest-items");

let digestPollTimer = null;
let digestBusy = false;

function setDigestBusy(value) {
  digestBusy = value;
  digestSubmitBtn.disabled = value;
}

// При заданной теме показывается фиксированный топ-5 по релевантности
// (см. agent/digest.py::run_digest) — «Показать N статей» в этом режиме
// не используется, чтобы не вводить в заблуждение.
function updateDigestQueryHint() {
  const hasQuery = digestQueryEl.value.trim().length > 0;
  digestQueryHint.classList.toggle("hidden", !hasQuery);
  digestLimitEl.disabled = hasQuery;
  digestLimitLabel.classList.toggle("disabled", hasQuery);
}
digestQueryEl.addEventListener("input", updateDigestQueryHint);
updateDigestQueryHint();

function renderDigestProgress(messages, running) {
  digestProgressList.innerHTML = "";
  messages.forEach((msg, i) => {
    const li = document.createElement("li");
    li.textContent = msg;
    if (i === messages.length - 1 && running) {
      const spinner = document.createElement("span");
      spinner.className = "spinner";
      li.prepend(spinner);
    }
    digestProgressList.appendChild(li);
  });
}

function renderDigestError(message) {
  digestProgressPanel.classList.add("hidden");
  digestResultPanel.classList.add("hidden");
  digestErrorPanel.classList.remove("hidden");
  digestErrorText.textContent = "Ошибка: " + message;
}

function renderDigestAnalysis(analysis) {
  const box = document.createElement("div");
  box.className = "digest-item-analysis";

  const summary = document.createElement("div");
  summary.className = "digest-analysis-summary";
  appendMarkdown(summary, analysis.summary_ru);
  box.appendChild(summary);

  // Метаданные (OpenAlex) и разбор PDF — независимые части: у свежего
  // препринта обычно нет первого, но есть второй.
  if (!analysis.details) {
    const unindexed = document.createElement("div");
    unindexed.className = "digest-analysis-unindexed";
    unindexed.textContent = "Метаданные: — (статья ещё не проиндексирована в OpenAlex)";
    box.appendChild(unindexed);
  } else {
    const meta = document.createElement("div");
    meta.className = "digest-analysis-meta";
    const cited = analysis.details.citation_count !== null && analysis.details.citation_count !== undefined
      ? analysis.details.citation_count : "—";
    const venue = analysis.details.venue || "—";
    meta.textContent = `Цитирований: ${cited} · Venue: ${venue}`;
    box.appendChild(meta);

    if (analysis.details.authors && analysis.details.authors.length > 0) {
      const list = document.createElement("ul");
      list.className = "digest-analysis-authors";
      analysis.details.authors.forEach((author) => {
        const li = document.createElement("li");
        const inst = author.institution || "—";
        const h = author.h_index !== null && author.h_index !== undefined ? author.h_index : "—";
        li.textContent = `${author.name} — ${inst}, h-index: ${h}`;
        list.appendChild(li);
      });
      box.appendChild(list);
    }
  }

  box.appendChild(renderPaperInsights(analysis.insights));
  return box;
}

// LLM отвечает markdown'ом (**жирный**, списки через * / -), и показывать
// его сырым — это звёздочки и дефисы прямо в тексте. Разбираем подмножество
// markdown в настоящие DOM-узлы, а НЕ через innerHTML: текст пришёл от
// модели, вставлять его как HTML нельзя.
function appendInlineMarkdown(parent, line) {
  // **жирный** и *курсив* — то, что реально встречается в этих ответах.
  line.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g).forEach((part) => {
    if (!part) return;
    if (part.startsWith("**") && part.endsWith("**") && part.length > 4) {
      const strong = document.createElement("strong");
      strong.textContent = part.slice(2, -2);
      parent.appendChild(strong);
    } else if (part.startsWith("*") && part.endsWith("*") && part.length > 2) {
      const em = document.createElement("em");
      em.textContent = part.slice(1, -1);
      parent.appendChild(em);
    } else {
      // Незакрытые ** остаются, если ответ модели обрезался по лимиту
      // токенов прямо посреди выделения — показывать их сырыми нельзя.
      parent.appendChild(document.createTextNode(part.replace(/\*\*/g, "")));
    }
  });
}

function appendMarkdown(parent, text) {
  const lines = (text || "").split("\n");
  let list = null;
  let paragraph = null;

  const closeBlocks = () => { list = null; paragraph = null; };

  lines.forEach((raw) => {
    const line = raw.trim();
    if (!line) { closeBlocks(); return; }

    const bullet = line.match(/^[*\-•]\s+(.*)$/);
    if (bullet) {
      paragraph = null;
      if (!list) {
        list = document.createElement("ul");
        list.className = "digest-md-list";
        parent.appendChild(list);
      }
      const li = document.createElement("li");
      appendInlineMarkdown(li, bullet[1]);
      list.appendChild(li);
      return;
    }

    list = null;
    if (!paragraph) {
      paragraph = document.createElement("p");
      paragraph.className = "digest-md-p";
      parent.appendChild(paragraph);
    } else {
      paragraph.appendChild(document.createTextNode(" "));
    }
    appendInlineMarkdown(paragraph, line);
  });
}

// Разбор полного текста статьи: результаты/сравнения (LLM по секциям PDF) и
// ссылки на код (детерминированно из самого PDF, не от модели).
function renderPaperInsights(insights) {
  if (!insights) {
    const missing = document.createElement("div");
    missing.className = "digest-analysis-unindexed";
    missing.textContent = "Разбор PDF: — (не удалось скачать или разобрать)";
    return missing;
  }

  const wrap = document.createElement("div");
  wrap.className = "digest-insights";

  const heading = document.createElement("div");
  heading.className = "digest-insights-heading";
  const sections = (insights.sections_used || []).join(", ");
  heading.textContent = sections ? `Разбор PDF (секции: ${sections})` : "Разбор PDF";
  wrap.appendChild(heading);

  const findings = document.createElement("div");
  findings.className = "digest-insights-findings";
  appendMarkdown(findings, insights.findings_ru);
  wrap.appendChild(findings);

  const authors = insights.authors || [];
  if (authors.length > 0) {
    const heading = document.createElement("div");
    heading.className = "digest-insights-heading";
    heading.textContent = "Авторы и аффилиации (из PDF)";
    wrap.appendChild(heading);

    const list = document.createElement("ul");
    list.className = "digest-analysis-authors";
    authors.forEach((author) => {
      const li = document.createElement("li");
      li.textContent = author.affiliation ? `${author.name} — ${author.affiliation}` : author.name;
      list.appendChild(li);
    });
    wrap.appendChild(list);
  }

  const links = insights.code_links || [];
  const linksEl = document.createElement("div");
  linksEl.className = "digest-insights-links";
  if (links.length === 0) {
    linksEl.classList.add("digest-analysis-unindexed");
    linksEl.textContent = "Код и модели: — (ссылок в PDF не нашлось)";
  } else {
    linksEl.appendChild(document.createTextNode("Код и модели: "));
    links.forEach((link, i) => {
      if (i > 0) linksEl.appendChild(document.createTextNode(" · "));
      const a = document.createElement("a");
      a.href = link.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = `${link.kind}: ${link.url}`;
      linksEl.appendChild(a);
      // stars === 0 — реальный ноль у нового репозитория, а не "не узнали";
      // "не узнали" (null) просто не показываем, чтобы не врать нулём.
      if (link.stars !== null && link.stars !== undefined) {
        const stars = document.createElement("span");
        stars.className = "digest-stars";
        stars.textContent = ` ★ ${link.stars}`;
        linksEl.appendChild(stars);
      }
    });
  }
  wrap.appendChild(linksEl);

  return wrap;
}

function renderItemAnalysisProgress(progressList, messages, running) {
  progressList.innerHTML = "";
  messages.forEach((msg, i) => {
    const li = document.createElement("li");
    li.textContent = msg;
    if (i === messages.length - 1 && running) {
      const spinner = document.createElement("span");
      spinner.className = "spinner";
      li.prepend(spinner);
    }
    progressList.appendChild(li);
  });
}

// Дайджест только ищет статьи (быстро); детальный анализ конкретной
// статьи (саммари + OpenAlex-метаданные) — N дополнительных LLM/сетевых
// вызовов, поэтому запускается по клику на карточке, а не сразу на весь
// список, и у каждой карточки свой прогресс — чтобы было видно, что
// именно эта статья ещё анализируется, а не что всё зависло.
async function pollItemAnalysis(jobId, itemId, btn, progressList, errorDiv, container) {
  let resp;
  try {
    resp = await fetch(`/api/digest/${jobId}/items/${encodeURIComponent(itemId)}/analyze`);
  } catch (e) {
    setTimeout(() => pollItemAnalysis(jobId, itemId, btn, progressList, errorDiv, container), 1500);
    return;
  }
  if (!resp.ok) {
    errorDiv.textContent = "Ошибка: не удалось получить статус анализа (" + resp.status + ")";
    errorDiv.classList.remove("hidden");
    btn.disabled = false;
    return;
  }
  const data = await resp.json();
  renderItemAnalysisProgress(progressList, data.progress, data.status === "running");

  if (data.status === "running") {
    setTimeout(() => pollItemAnalysis(jobId, itemId, btn, progressList, errorDiv, container), 1000);
  } else if (data.status === "done") {
    progressList.classList.add("hidden");
    btn.remove();
    container.appendChild(renderDigestAnalysis(data.result));
  } else {
    errorDiv.textContent = "Ошибка: " + (data.error || "неизвестная ошибка");
    errorDiv.classList.remove("hidden");
    btn.disabled = false;
  }
}

async function startItemAnalysis(jobId, itemId, btn, progressList, errorDiv, container) {
  btn.disabled = true;
  errorDiv.classList.add("hidden");
  progressList.classList.remove("hidden");
  progressList.innerHTML = "";

  let resp;
  try {
    resp = await fetch(`/api/digest/${jobId}/items/${encodeURIComponent(itemId)}/analyze`, { method: "POST" });
  } catch (err) {
    errorDiv.textContent = "Ошибка: не удалось связаться с сервером";
    errorDiv.classList.remove("hidden");
    btn.disabled = false;
    return;
  }

  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    errorDiv.textContent = "Ошибка: " + (data.detail || ("код ответа " + resp.status));
    errorDiv.classList.remove("hidden");
    btn.disabled = false;
    return;
  }

  pollItemAnalysis(jobId, itemId, btn, progressList, errorDiv, container);
}

function renderItemAnalysisControls(jobId, item) {
  const container = document.createElement("div");
  container.className = "digest-item-analysis-area";

  if (item.analysis) {
    container.appendChild(renderDigestAnalysis(item.analysis));
    return container;
  }

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "expand-btn digest-analyze-btn";
  btn.textContent = "Детальный анализ";
  container.appendChild(btn);

  const progressList = document.createElement("ul");
  progressList.className = "digest-item-analysis-progress hidden";
  container.appendChild(progressList);

  const errorDiv = document.createElement("div");
  errorDiv.className = "error hidden";
  container.appendChild(errorDiv);

  btn.addEventListener("click", () => startItemAnalysis(jobId, item.id, btn, progressList, errorDiv, container));

  return container;
}

function renderDigestResult(result, jobId) {
  digestErrorPanel.classList.add("hidden");
  const queryPart = result.query ? `по «${result.query}» ` : "";
  digestHeading.textContent =
    `${result.items.length} статей ${queryPart}за последние ${result.days} дн. в категориях ${result.categories.join(", ")}`;

  if (result.summary) {
    digestSummaryEl.textContent = result.summary;
    digestSummaryEl.classList.remove("hidden");
  } else {
    digestSummaryEl.classList.add("hidden");
  }

  digestItemsEl.innerHTML = "";
  result.items.forEach((item) => {
    const div = document.createElement("div");
    div.className = "digest-item";

    const title = document.createElement("div");
    title.className = "digest-item-title";
    if (item.url) {
      const a = document.createElement("a");
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = item.title;
      title.appendChild(a);
    } else {
      title.textContent = item.title;
    }
    div.appendChild(title);

    const meta = document.createElement("div");
    meta.className = "digest-item-meta";
    const authors = (item.authors || []).slice(0, 3).join(", ") + (item.authors.length > 3 ? " и др." : "");
    const date = (item.published_date || "").slice(0, 10);
    meta.textContent = [authors, date].filter(Boolean).join(" · ");
    div.appendChild(meta);

    const abstract = document.createElement("div");
    abstract.className = "digest-item-abstract";
    abstract.textContent = item.abstract;
    div.appendChild(abstract);

    div.appendChild(renderItemAnalysisControls(jobId, item));

    digestItemsEl.appendChild(div);
  });

  digestResultPanel.classList.remove("hidden");
}

async function pollDigest(jobId) {
  let resp;
  try {
    resp = await fetch(`/api/digest/${jobId}`);
  } catch (e) {
    digestPollTimer = setTimeout(() => pollDigest(jobId), 1500);
    return;
  }
  if (!resp.ok) {
    renderDigestError("не удалось получить статус запроса (" + resp.status + ")");
    setDigestBusy(false);
    return;
  }
  const data = await resp.json();
  renderDigestProgress(data.progress, data.status === "running");

  if (data.status === "running") {
    digestPollTimer = setTimeout(() => pollDigest(jobId), 1000);
  } else if (data.status === "done") {
    digestProgressPanel.classList.add("hidden");
    renderDigestResult(data.result, jobId);
    setDigestBusy(false);
  } else {
    renderDigestError(data.error || "неизвестная ошибка");
    setDigestBusy(false);
  }
}

digestForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (digestBusy) return;
  if (digestPollTimer) clearTimeout(digestPollTimer);

  digestProgressPanel.classList.remove("hidden");
  digestErrorPanel.classList.add("hidden");
  digestResultPanel.classList.add("hidden");
  digestProgressList.innerHTML = "";
  setDigestBusy(true);

  const checked = Array.from(digestCategoriesEl.querySelectorAll("input:checked")).map((el) => el.value);
  const body = {
    days: Number(digestDaysEl.value) || null,
    limit: Number(digestLimitEl.value) || null,
    categories: checked.length > 0 ? checked : null,
    summarize: !digestNoSummaryEl.checked,
    query: digestQueryEl.value.trim() || null,
  };

  let resp;
  try {
    resp = await fetch("/api/digest", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch (err) {
    renderDigestError("не удалось связаться с сервером");
    setDigestBusy(false);
    return;
  }

  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    renderDigestError(data.detail || ("ошибка запроса (" + resp.status + ")"));
    setDigestBusy(false);
    return;
  }

  const data = await resp.json();
  pollDigest(data.job_id);
});
</script>
