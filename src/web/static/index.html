<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>local-research-agent</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --warn-bg: #fff7ed;
    --warn-border: #fdba74;
    --error-bg: #fef2f2;
    --error-border: #fca5a5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #1f2025;
      --text: #e8e8ea;
      --muted: #9a9ba3;
      --border: #33343a;
      --accent: #3b82f6;
      --accent-text: #0b0d12;
      --warn-bg: #2a2015;
      --warn-border: #7c4a12;
      --error-bg: #2a1616;
      --error-border: #7c2626;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  textarea {
    flex: 1;
    resize: vertical;
    min-height: 44px;
    max-height: 200px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 0 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  #progress-list {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 13px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #progress-list li {
    padding: 2px 0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #progress-list li:last-child {
    color: var(--text);
    font-weight: 600;
  }
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #answer {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
  }
  #sources { margin: 8px 0 0; padding-left: 20px; font-size: 14px; }
  #sources li { margin-bottom: 4px; }
  #stats { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .gaps {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-top: 12px;
  }
  .gaps strong { display: block; margin-bottom: 4px; }
  .error {
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>local-research-agent</h1>
  <p class="subtitle">Deep-research: arXiv, Semantic Scholar, веб-поиск — локально, на MLX.</p>

  <form id="form">
    <textarea id="question" placeholder="Задайте вопрос для исследования…" required></textarea>
    <button id="submit" type="submit">Спросить</button>
  </form>

  <div id="progress-panel" class="panel hidden">
    <h2>Ход исследования</h2>
    <ul id="progress-list"></ul>
  </div>

  <div id="error-panel" class="hidden">
    <div class="error" id="error-text"></div>
  </div>

  <div id="result-panel" class="panel hidden">
    <h2>Ответ</h2>
    <div id="answer"></div>
    <div id="gaps-wrap"></div>
    <h2 style="margin-top:16px">Источники</h2>
    <ol id="sources"></ol>
    <div id="stats"></div>
  </div>
</div>

<script>
const form = document.getElementById("form");
const questionEl = document.getElementById("question");
const submitBtn = document.getElementById("submit");
const progressPanel = document.getElementById("progress-panel");
const progressList = document.getElementById("progress-list");
const errorPanel = document.getElementById("error-panel");
const errorText = document.getElementById("error-text");
const resultPanel = document.getElementById("result-panel");
const answerEl = document.getElementById("answer");
const sourcesEl = document.getElementById("sources");
const statsEl = document.getElementById("stats");
const gapsWrap = document.getElementById("gaps-wrap");

let pollTimer = null;

function resetUI() {
  progressPanel.classList.remove("hidden");
  errorPanel.classList.add("hidden");
  resultPanel.classList.add("hidden");
  progressList.innerHTML = "";
  gapsWrap.innerHTML = "";
}

function renderProgress(messages, running) {
  progressList.innerHTML = "";
  messages.forEach((msg, i) => {
    const li = document.createElement("li");
    const isLast = i === messages.length - 1;
    li.textContent = msg;
    if (isLast && running) {
      const spinner = document.createElement("span");
      spinner.className = "spinner";
      li.prepend(spinner);
    }
    progressList.appendChild(li);
  });
  progressList.scrollTop = progressList.scrollHeight;
}

function renderResult(result) {
  progressPanel.classList.add("hidden");
  resultPanel.classList.remove("hidden");
  answerEl.textContent = result.answer;

  sourcesEl.innerHTML = "";
  result.sources.forEach((title) => {
    const li = document.createElement("li");
    li.textContent = title;
    sourcesEl.appendChild(li);
  });

  gapsWrap.innerHTML = "";
  if (result.gaps && result.gaps.length > 0) {
    const div = document.createElement("div");
    div.className = "gaps";
    const strong = document.createElement("strong");
    strong.textContent = "Непокрытые вопросы (бюджет исследования исчерпан):";
    div.appendChild(strong);
    result.gaps.forEach((gap) => {
      const p = document.createElement("div");
      p.textContent = "— " + gap;
      div.appendChild(p);
    });
    gapsWrap.appendChild(div);
  }

  statsEl.textContent =
    `Итераций: ${result.iterations} · прочитано источников: ${result.read_count} · ` +
    `найдено кандидатов: ${result.candidates_count}`;
}

function renderError(message) {
  progressPanel.classList.add("hidden");
  errorPanel.classList.remove("hidden");
  errorText.textContent = "Ошибка: " + message;
}

async function poll(jobId) {
  let resp;
  try {
    resp = await fetch(`/api/jobs/${jobId}`);
  } catch (e) {
    pollTimer = setTimeout(() => poll(jobId), 1500);
    return;
  }
  if (!resp.ok) {
    renderError("не удалось получить статус запроса (" + resp.status + ")");
    submitBtn.disabled = false;
    return;
  }
  const data = await resp.json();
  renderProgress(data.progress, data.status === "running");

  if (data.status === "running") {
    pollTimer = setTimeout(() => poll(jobId), 1000);
  } else if (data.status === "done") {
    renderResult(data.result);
    submitBtn.disabled = false;
  } else {
    renderError(data.error || "неизвестная ошибка");
    submitBtn.disabled = false;
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = questionEl.value.trim();
  if (!question) return;

  if (pollTimer) clearTimeout(pollTimer);
  resetUI();
  submitBtn.disabled = true;

  let resp;
  try {
    resp = await fetch("/api/jobs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
  } catch (err) {
    renderError("не удалось связаться с сервером");
    submitBtn.disabled = false;
    return;
  }

  if (resp.status === 409) {
    const data = await resp.json();
    renderError(data.detail || "уже выполняется другой запрос");
    submitBtn.disabled = false;
    return;
  }
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    renderError(data.detail || ("ошибка запроса (" + resp.status + ")"));
    submitBtn.disabled = false;
    return;
  }

  const data = await resp.json();
  poll(data.job_id);
});
</script>
</body>
</html>
